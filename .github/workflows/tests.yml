name: Research implementation checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: pytest -q --junitxml=reports/ci-tests.xml
      - run: python -m crackvit --help
      - run: python -m crackvit doctor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/ci-tests.xml
