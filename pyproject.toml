[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pavement-vit-research"
version = "0.1.0"
description = "Auditable ViT pavement crack segmentation research pipelines"
requires-python = ">=3.10"
dependencies = ["torch==2.6.0", "torchvision==0.21.0", "numpy==2.2.6", "Pillow==11.2.1", "matplotlib==3.10.3", "scipy==1.15.3", "PyYAML==6.0.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13"]
download = ["gdown==5.2.0"]

[project.scripts]
crackvit = "crackvit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
