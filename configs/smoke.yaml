# Real-data execution check, deliberately small. Not a benchmark reproduction.
data:
  manifest: datasets/manifests/deepcrack.csv
  root: datasets/raw/deepcrack
  height: 96
  width: 128
  max_train: 24
  max_val: 12
  workers: 0
model:
  name: vit
  patch_size: 8
  embed_dim: 48
  depth: 2
  heads: 3
  dropout: 0.0
  decoder_channels: 32
  base_channels: 8
train:
  epochs: 3
  batch_size: 4
  learning_rate: 0.001
  patience: 3
  threads: 4
  seed: 42
  device: cpu
output: runs/smoke-vit
purpose: smoke
